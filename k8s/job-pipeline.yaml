apiVersion: batch/v1
kind: Job
metadata:
  name: content-creator-manual-job
  namespace: content-creator
  labels:
    app.kubernetes.io/name: content-creator
    app.kubernetes.io/component: pipeline-job
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: content-creator
        app.kubernetes.io/component: pipeline-job
    spec:
      restartPolicy: Never
      containers:
        - name: content-creator
          image: content-creator:local
          imagePullPolicy: Never
          command: ["python", "run_pipeline.py", "--channel", "betheo"]
          envFrom:
            - secretRef:
                name: content-creator-secrets
                optional: true
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: output-storage
              mountPath: /app/output
            - name: google-credentials
              mountPath: /app/credentials.json
              subPath: credentials.json
              readOnly: true
            - name: google-credentials
              mountPath: /app/token.json
              subPath: token.json
              readOnly: true
            - name: google-credentials
              mountPath: /app/drive_token.json
              subPath: drive_token.json
              readOnly: true
      volumes:
        - name: output-storage
          persistentVolumeClaim:
            claimName: content-creator-output-pvc
        - name: google-credentials
          secret:
            secretName: content-creator-google-tokens
            optional: true
