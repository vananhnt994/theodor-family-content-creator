apiVersion: batch/v1
kind: Job
metadata:
  name: content-creator-verification-job
  namespace: content-creator
  labels:
    app.kubernetes.io/name: content-creator
    app.kubernetes.io/component: test-job
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: content-creator
    spec:
      restartPolicy: Never
      containers:
        - name: content-creator
          image: content-creator:local
          imagePullPolicy: Never
          command: ["python", "-c", "import sys, os, playwright, PIL, fitz; print('✅ Python, Playwright, Pillow & PyMuPDF initialized successfully in Kubernetes!'); print('📁 Output PVC dir accessible:', os.path.isdir('/app/output'))"]
          envFrom:
            - secretRef:
                name: content-creator-secrets
                optional: true
          volumeMounts:
            - name: output-storage
              mountPath: /app/output
            - name: google-credentials
              mountPath: /app/credentials.json
              subPath: credentials.json
              readOnly: true
            - name: google-credentials
              mountPath: /app/token.json
              subPath: token.json
              readOnly: true
            - name: google-credentials
              mountPath: /app/drive_token.json
              subPath: drive_token.json
              readOnly: true
      volumes:
        - name: output-storage
          persistentVolumeClaim:
            claimName: content-creator-output-pvc
        - name: google-credentials
          secret:
            secretName: content-creator-google-tokens
            optional: true
